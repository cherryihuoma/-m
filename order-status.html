<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Status — Îæm</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Syne:wght@400;500;700;800&family=DM+Mono:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .order-status-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 100px 24px 60px;
    }
    .order-status-form {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 40px;
      border-radius: 4px;
    }
    .order-status-title {
      font-family: var(--font-d);
      font-size: 32px;
      font-weight: 300;
      color: var(--text);
      margin-bottom: 24px;
      text-align: center;
    }
    .order-status-title em {
      font-style: italic;
      color: var(--accent);
    }
    .order-result {
      margin-top: 24px;
      padding: 24px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: none;
    }
    .order-result.visible {
      display: block;
      animation: fadeUp 0.5s var(--ease);
    }
    .order-id {
      font-family: var(--font-m);
      font-size: 14px;
      letter-spacing: 0.2em;
      color: var(--gold-use);
      margin-bottom: 12px;
    }
    .order-status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 2px;
      font-family: var(--font-m);
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .status-enquiry {
      background: rgba(198, 162, 90, 0.15);
      color: var(--gold-use);
    }
    .status-confirmed {
      background: rgba(75, 46, 43, 0.3);
      color: var(--text);
    }
    .status-production {
      background: rgba(139, 26, 26, 0.2);
      color: var(--cherry-glow);
    }
    .status-complete {
      background: rgba(0, 51, 20, 0.3);
      color: #4caf50;
    }
    .status-delivered {
      background: rgba(0, 0, 128, 0.2);
      color: #6495ed;
    }
    .order-details {
      font-family: var(--font-s);
      font-size: 15px;
      line-height: 1.8;
      color: var(--text2);
    }
    .order-actions {
      margin-top: 24px;
      text-align: center;
    }
    .back-link {
      display: inline-block;
      margin-top: 24px;
      font-family: var(--font-m);
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-use);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="order-status-container">
    <h1 class="order-status-title">Track Your <em>Order</em></h1>
    
    <div class="order-status-form">
      <form id="orderStatusForm" onsubmit="checkOrderStatus(event)">
        <div class="form-group">
          <label class="form-label" for="orderId">Order ID</label>
          <input 
            class="form-input" 
            type="text" 
            id="orderId" 
            placeholder="e.g., IAM-001" 
            required 
          />
        </div>
        <button type="submit" class="btn-primary btn-fullwidth">Check Status</button>
      </form>
      
      <div class="order-result" id="orderResult">
        <div class="order-id" id="resultOrderId"></div>
        <div class="order-status-badge" id="resultStatus"></div>
        <div class="order-details" id="resultDetails"></div>
      </div>
    </div>
    
    <div class="order-actions">
      <a href="index.html" class="back-link">← Back to Îæm</a>
    </div>
  </div>
  
  <script>
    // This is a simple demo. In production, this would query a database.
    // For now, it shows the structure.
    const orderData = {
      'IAM-001': {
        status: 'In Production',
        statusClass: 'status-production',
        details: 'Your Empire Jacket is being crafted. Expected completion: 2 weeks.'
      },
      'IAM-002': {
        status: 'Confirmed',
        statusClass: 'status-confirmed',
        details: 'Your measurements have been received. Production will begin shortly.'
      }
    };
    
    function checkOrderStatus(event) {
      event.preventDefault();
      const orderId = document.getElementById('orderId').value.trim().toUpperCase();
      const result = document.getElementById('orderResult');
      
      if (orderData[orderId]) {
        document.getElementById('resultOrderId').textContent = orderId;
        document.getElementById('resultStatus').textContent = orderData[orderId].status;
        document.getElementById('resultStatus').className = 'order-status-badge ' + orderData[orderId].statusClass;
        document.getElementById('resultDetails').textContent = orderData[orderId].details;
        result.classList.add('visible');
      } else {
        document.getElementById('resultOrderId').textContent = 'Order not found';
        document.getElementById('resultStatus').textContent = 'Please check your Order ID';
        document.getElementById('resultStatus').className = 'order-status-badge status-enquiry';
        document.getElementById('resultDetails').textContent = 'If you believe this is an error, contact us on WhatsApp.';
        result.classList.add('visible');
      }
    }
  </script>
</body>
</html>
